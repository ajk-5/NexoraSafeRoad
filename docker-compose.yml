# docker compose up --build
#   API:      http://localhost:8000/docs
#   Postgres: localhost:5432 (credentials from .env)
# The AI pipeline and the training worker run on the host (they need the GPU/webcam):
#   python -m ai.main --source <video> --backend http://localhost:8000
#   python -m ai.trainer --backend http://localhost:8000
services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-saferoad}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-saferoad}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 2s
      timeout: 3s
      retries: 15

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-saferoad}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@db:5432/${POSTGRES_DB:-saferoad}
      MEDIA_DIR: /data/media
      TRAINING_DIR: /data/training
      AI_API_KEY: ${AI_API_KEY:?Set AI_API_KEY in .env}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173}
      SEED_DEMO_OPERATORS: ${SEED_DEMO_OPERATORS:-0}
      DEMO_PASSWORD: ${DEMO_PASSWORD:-}
    ports:
      - "8000:8000"
    volumes:
      - media:/data/media
      - training:/data/training
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
  media:
  training:
